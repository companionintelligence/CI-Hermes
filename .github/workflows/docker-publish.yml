name: Docker Build and Push
on:
  # Release tags only. This was `"*"`, which meant ANY tag pushed by a human built
  # and pushed a real multi-arch image to GHCR and created a public GitHub Release —
  # including the throwaway `test-publish-1` tag this workflow's own runbook used to
  # tell you to push as a verification step.
  #
  # Every release tag is vYYYY.M.D with an optional same-day suffix (v2026.7.7.2).
  # Narrowed to three segments, matching npm-publish.yml so a release tag means the
  # same thing to both. Checked against all 25 tags this repo has ever had, plus the
  # since-deleted `v2026.5.16-1`: every one matches, so nothing that ever released is
  # excluded. The trailing `*` absorbs the same-day `.N` suffix.
  #
  # Still a coarse filter, not validation — a glob is not a regex, so `v1-scratch.0.0`
  # gets through. It only limits how much machinery a junk tag can start.
  #
  # This does not affect the bot path below. Tags pushed by the tagger workflow use
  # GITHUB_TOKEN, which deliberately does not trigger further workflows — which is
  # exactly why the workflow_run trigger exists.
  #
  # That bot path is wired ahead of itself right now: "Tag CI-Hermes Version On Merge"
  # is still gated to workflow_dispatch, and its only job requires a merged
  # pull_request, so it cannot cut a tag and this trigger cannot fire. Releases are cut
  # by pushing a release tag until that workflow is ungated.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    workflows:
      - "Tag CI-Hermes Version On Merge"
    types:
      - completed

# One build in flight per release, and never cancel-in-progress: a cancelled build
# leaves a tag with no image. Same key as npm-publish.yml, for the same reason —
# `github.ref_name` is the tag on a tag push, but on a `workflow_run` it resolves to
# the BRANCH the tagger ran on, so every bot-cut release would share one group and
# queue behind the previous one. The triggering run's head SHA identifies the release
# commit instead.
#
# This replaces a plain `${{ github.workflow }}-${{ github.ref }}`. That key does not
# separate releases at all on the bot path, for the reason just given, and a group
# holds only ONE pending entry — so with three releases in flight the queued second is
# cancelled by the third, and a cancelled build leaves a tag with no image. That is the
# state v2026.7.1 is in, and CI-OpenClaw's copy of this workflow calls the unkeyed form
# "actively harmful" on the strength of it.
concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    name: Build and push to GitHub Container Registry
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # `ref` is a bare 40-hex SHA, so actions/checkout fetches that one commit
          # with `--no-tags` and `fetch-depth: 0` brings down no tag refs at all. The
          # next step resolves the release tag with `git tag --points-at HEAD`, which
          # would then always come back empty.
          fetch-tags: true

      - name: Checkout (push tag)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set TAG from workflow_run commit
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          # Same derivation npm-publish.yml uses: only a release-shaped tag counts, and
          # if none points at this commit there is nothing to publish.
          #
          # This used to fall back to the hermes-agent version pinned in the Dockerfile.
          # That version is upstream's, and upstream names its releases vYYYY.M.D — the
          # same namespace this repo's own release tags live in. The pin is `v2026.7.30`
          # today, which is also a real release tag here, so the fallback would build
          # whatever tree it happened to check out and `--push` it over the published
          # `ci-hermes:v2026.7.30` image, with no GitHub Release to record that it
          # happened (that step is push-only). Skipping is the safe answer.
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [[ -z "${tag}" ]]; then
            echo "::notice::no release tag points at this commit; nothing to publish"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Set TAG from pushed ref
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # SKIP is set only by the workflow_run path, when no release tag points at the
      # commit the tagger ran on. Everything from here down publishes something, so it
      # all has to stay behind that guard.
      - name: Set image name
        if: env.SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image='${{ vars.IMAGE_NAME }}'
          if [[ -z "${image}" ]]; then
            image='ghcr.io/${{ github.repository }}'
          fi
          echo "IMAGE_NAME=${image,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: env.SKIP != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Setup QEMU with credential support (fixes sudo in cross-arch builds)
        if: env.SKIP != 'true'
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes --credential yes

      - name: Setup Docker buildx
        if: env.SKIP != 'true'
        run: docker buildx create --use

      - name: Run Docker buildx
        if: env.SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE_NAME}:${TAG}" \
            --push .

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
