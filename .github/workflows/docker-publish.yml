name: Docker Build and Push
on:
  # Release tags only. This was `"*"`, which meant ANY tag pushed by a human built
  # and pushed a real multi-arch image to GHCR and created a public GitHub Release —
  # including the throwaway `test-publish-1` tag this workflow's own runbook used to
  # tell you to push as a verification step.
  #
  # Every release tag is vYYYY.M.D with an optional same-day suffix (v2026.7.7.2).
  # Narrowed to three segments, matching npm-publish.yml so a release tag means the
  # same thing to both. Checked against all 25 tags this repo has ever had, plus the
  # since-deleted `v2026.5.16-1`: every one matches, so nothing that ever released is
  # excluded. The trailing `*` absorbs the same-day `.N` suffix.
  #
  # Still a coarse filter, not validation — a glob is not a regex, so `v1-scratch.0.0`
  # gets through. It only limits how much machinery a junk tag can start.
  #
  # This does not affect the bot path below. Tags pushed by the tagger workflow use
  # GITHUB_TOKEN, which deliberately does not trigger further workflows — which is
  # exactly why the workflow_run trigger exists.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    workflows:
      - "Tag CI-Hermes Version On Merge"
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    name: Build and push to GitHub Container Registry
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Checkout (push tag)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set TAG from workflow_run commit
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | head -n1 || true)
          if [[ -n "${tag}" ]]; then
            echo "TAG=${tag}" >> "$GITHUB_ENV"
          else
            version=$(grep -oE 'nousresearch/hermes-agent:[^@[:space:]]+@sha256:[a-f0-9]{64}' Dockerfile | head -n1 | sed -nE 's|.*nousresearch/hermes-agent:([^@]+)@sha256:[a-f0-9]{64}|\1|p')
            if [[ -z "${version}" || "${version}" == "latest" ]]; then
              version=$(sed -nE 's/^# Pinned to latest \(([^)]+)\) by digest\..*$/\1/p' Dockerfile | head -n1 || true)
            fi
            if [[ -n "${version}" ]]; then
              echo "TAG=${version}" >> "$GITHUB_ENV"
            else
              digest=$(grep -oE 'nousresearch/hermes-agent:[^@[:space:]]+@sha256:[a-f0-9]{64}' Dockerfile | head -n1 | cut -d'@' -f2)
              digest_short="${digest#sha256:}"
              digest_short="${digest_short:0:12}"
              echo "TAG=digest-${digest_short}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set TAG from pushed ref
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail
          image='${{ vars.IMAGE_NAME }}'
          if [[ -z "${image}" ]]; then
            image='ghcr.io/${{ github.repository }}'
          fi
          echo "IMAGE_NAME=${image,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Setup QEMU with credential support (fixes sudo in cross-arch builds)
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes --credential yes

      - name: Setup Docker buildx
        run: docker buildx create --use

      # The wrapper reads SENTRY_DSN from its process env at start-up, but nothing
      # supplies one to a marketplace install — so until now every published image
      # reported nothing. Baking it here is what makes the opt-out default real.
      #
      # A missing secret must not fail the publish: `--build-arg SENTRY_DSN=` is a
      # valid empty value, the Dockerfile ARG default takes over, and the image is
      # simply unconfigured (disabledReason "no-dsn") exactly as before.
      - name: Run Docker buildx
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::notice::SENTRY_DSN secret is not set — publishing an image with no DSN compiled in. Error reporting stays inert (disabledReason: no-dsn)."
          else
            echo "SENTRY_DSN is set — baking it into ${IMAGE_NAME}:${TAG}."
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "SENTRY_DSN=${SENTRY_DSN}" \
            --build-arg "SENTRY_RELEASE=ci-hermes-server@${TAG}" \
            --tag "${IMAGE_NAME}:${TAG}" \
            --push .

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
