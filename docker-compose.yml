services:
  # Web terminal UI + dashboard (proxied through Node server)
  web:
    build: .
    image: ci-hermes:v2026.7.30
    container_name: hermes-web
    hostname: hermes # Shell prompt shows "hermes@hermes" instead of "hermes@<container-id>"
    restart: unless-stopped
    init: true
    user: "1000:1000"
    environment:
      APP_SEED: ${APP_SEED:-dev} # Provided by CI marketplace; fallback for local dev
      GATEWAY_ALLOWED_USERS: ${GATEWAY_ALLOWED_USERS:-} # Set to your messaging user ID(s) to avoid default-deny gateway auth
      # Tells the dashboard to probe the gateway via HTTP instead of local PID detection
      GATEWAY_HEALTH_URL: http://hermes-gateway:8642
      # Route local Ollama through the native /api/chat API (honors num_ctx) instead
      # of the OpenAI-compat /v1 endpoint (which ignores it). Empty = off (stock /v1).
      CI_HERMES_OLLAMA_NATIVE: ${CI_HERMES_OLLAMA_NATIVE:-}
      # Opt-in error reporting for the wrapper (server.cjs). No DSN = the SDK is
      # never loaded and nothing leaves the container; CI_TELEMETRY/CI_LOCAL_ONLY
      # switch it off again without a rebuild. docs/operations/error-reporting.md
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CI_HERMES_VERSION: ${CI_HERMES_VERSION:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
    ports:
      # Expose local dev on 18790 to match the CI app port; the Node server listens on 18789.
      - "18790:18789"
    volumes:
      - ./data:/opt/data
    networks:
      - hermes-net
    depends_on:
      - gateway

  # Hermes messaging gateway
  gateway:
    image: ci-hermes:v2026.7.30
    container_name: hermes-gateway
    restart: unless-stopped
    init: true
    user: "1000:1000"
    entrypoint: ["/app/gateway-entrypoint.sh"]
    command: gateway run
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      GATEWAY_ALLOWED_USERS: ${GATEWAY_ALLOWED_USERS:-}
      # API server exposes the health endpoint the dashboard probes via GATEWAY_HEALTH_URL.
      # Must bind to 0.0.0.0 (not default 127.0.0.1) to be reachable from the web container.
      # Binding to 0.0.0.0 requires an API key — we reuse APP_SEED since the port is
      # internal only (not exposed to host).
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${APP_SEED:-hermes-internal-key}
      # Route local Ollama through native /api/chat (honors num_ctx); empty = off.
      CI_HERMES_OLLAMA_NATIVE: ${CI_HERMES_OLLAMA_NATIVE:-}
    volumes:
      - ./data:/opt/data
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
